[project]
name = "ai-resume-parser"
version = "0.1.0"
description = "FastAPI service for extracting and matching resume data"
readme = "README.md"
authors = [
    { name = "PranavAggarwal28", email = "pranavaggarwal173@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx>=0.2.4",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "groq>=1.7.0",
    "plyer>=2.1.0",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
